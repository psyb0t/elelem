name: pipeline

# A Go library: no image, no binaries. Every branch push runs lint, tests with
# the coverage gate, the security scan and the codegen drift check, all through
# the Makefile in the repo's dev image. Default-branch runs then refresh the
# badges. A v* tag does not rerun the checks: it waits for that commit's
# default-branch run to succeed, cuts the GitHub release from the annotated tag
# message, and refreshes the badges with that run's coverage.
on:
  push:
  # Refreshes the imported-by badge. WEEKLY, not daily: pkg.go.dev's crawl lags
  # publication by days, so a daily run re-derives an unchanged number six extra
  # times a week, and each drags the full test suite along, since the badges
  # job needs the coverage artifact.
  #
  # The WHOLE pipeline, not a badges-only job: the badge publisher wipes its
  # branch and republishes only what the run produced, so a badges-only refresh
  # would delete coverage/version/license.
  #
  # Slot derived from a hash of the repo name. GitHub cron has no randomness,
  # and the scheduler sheds queued runs hardest at the round numbers a human
  # would pick.
  schedule:
    - cron: "1 13 * * 5"
  workflow_dispatch:

permissions: {}

jobs:
  code:
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
      security-events: write # for the sec SARIF upload
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      lint_command: "make lint"
      test_command: "make test-coverage"
      sec_command: "make sec"
      generate_command: "make generate"
      coverage_file: "coverage-percent.txt"
      sarif_file: "sec.sarif"
      sarif_category: "go"

  wait:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/wait-for-default-branch.yml@master

  release:
    needs: [wait]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/release-workflow.yml@master

  # Tag runs read the coverage artifact from the default-branch run they
  # release.
  badges:
    needs: [code, wait]
    if: "always() && ((github.ref_name == github.event.repository.default_branch && needs.code.result == 'success') || (startsWith(github.ref, 'refs/tags/') && needs.wait.result == 'success'))"
    permissions:
      contents: write
      actions: read # cross-run coverage artifact download on tags
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
    with:
      coverage: true
      coverage_run_id: ${{ needs.wait.outputs.run_id }}
      importers: true
