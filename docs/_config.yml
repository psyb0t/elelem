title: elelem
tagline: A provider-neutral Go engine for LLM requests
description: A Go library for LLM requests on OpenAI-compatible, Anthropic and Z.ai Coding models, with streaming, tool loops, history budgets, retries and typed replies.
lang: en
url: https://psyb0t.github.io
baseurl: /elelem
repository: psyb0t/elelem
author: Ciprian Mandache

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: mocha

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-include-cache

permalink: pretty

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      seo:
        type: TechArticle

search:
  heading_level: 3

aux_links:
  GitHub:
    - https://github.com/psyb0t/elelem
aux_links_new_tab: true

nav_external_links:
  - title: API reference
    url: https://pkg.go.dev/github.com/psyb0t/elelem
  - title: Changelog
    url: https://github.com/psyb0t/elelem/blob/main/CHANGELOG.md

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/psyb0t/elelem
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
