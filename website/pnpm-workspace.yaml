# Resolve only releases at least seven days old (minutes).
minimumReleaseAge: 10080
ignoreScripts: true
# Patched releases of build-time transitives that Docusaurus 3.10.2 still pins
# to vulnerable ranges: tinypool (GHSA prototype pollution to RCE),
# serialize-javascript (RCE, DoS and XSS advisories) and uuid (buffer bounds).
overrides:
  tinypool: 2.1.2
  serialize-javascript: 7.1.3
  "uuid@<11.1.1": 11.1.1
